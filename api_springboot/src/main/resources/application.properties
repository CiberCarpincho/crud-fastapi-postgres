spring.application.name=tareas

# Valores por defecto para ejecucion local.
# En Docker/EC2 se sobreescriben con variables de entorno (ver docker-compose.yml).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/appdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
# Las credenciales son obligatorias y se inyectan por variables de entorno.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${SERVER_PORT:8085}

# Endpoint usado para verificar el despliegue en EC2.
# No se exponen detalles internos (base de datos, disco, etc.).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Documentacion habilitada para el taller. En produccion: SPRINGDOC_ENABLED=false.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
